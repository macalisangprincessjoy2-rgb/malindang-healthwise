<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;display:grid;place-items:center;background:#f3f8f5;font-family:Arial,sans-serif;color:#203947}.card{width:min(430px,100%);background:#fff;border:1px solid #e2eee8;border-radius:14px;padding:28px;box-shadow:0 8px 24px rgba(30,72,54,.07)}h1{color:#1f4d4d;font-size:23px;margin:0 0 8px}.muted{color:#74837f;font-size:13px;line-height:1.5}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:bold;color:#52635f}.field input{width:100%;padding:11px;border:1px solid #d8e4df;border-radius:8px;font-size:14px}button{width:100%;padding:12px;background:#2a7f62;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.error{color:#b22222;font-size:13px;font-weight:bold}.back{display:block;margin-top:14px;text-align:center;color:#208d4c;text-decoration:none;font-size:13px;font-weight:bold}
    </style>
</head>
<body><main class="card"><h1>Reset Password</h1><p class="muted">Isulod ang imong username, registered email, ug bag-ong password.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><div class="field"><label for="username">Username</label><input id="username" name="username" required></div><div class="field"><label for="email">Registered Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="new_password">Bag-ong Password</label><input id="new_password" name="new_password" type="password" minlength="8" required></div><button type="submit">Reset Password</button></form><a class="back" href="{{ url_for('login') }}">Balik sa Pag-login</a></main></body>
</html>
