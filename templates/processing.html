<!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2;url={{ url_for('assessment_detail', assessment_id=result['assessment_id']) }}">
    <title>Giproseso ang Pagtan-aw</title>
    <style>
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; padding:16px; display:grid; place-items:center; background:#f7fbf9; font-family:Arial,sans-serif; color:#203947; }
        .card { width:min(520px,100%); text-align:center; background:#fff; border:1px solid #e2eee8; border-radius:14px; padding:34px; box-shadow:0 8px 24px rgba(30,72,54,.07); }
        img { width:110px; margin-bottom:12px; }
        h1 { font-size:22px; margin:8px 0; }.muted { color:#74837f; font-size:13px; line-height:1.5; }
        .loader { width:42px; height:42px; margin:20px auto; border:4px solid #dff2e4; border-top-color:#26a957; border-radius:50%; animation:spin 1s linear infinite; }
        .steps { text-align:left; max-width:280px; margin:18px auto 0; color:#52635f; font-size:12px; line-height:2; }.done { color:#26a957; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @media(max-width:480px){.card{padding:24px 18px}h1{font-size:20px}.steps{text-align:left}}
    </style>
</head>
<body>
    <main class="card">
        <img src="{{ url_for('static', filename='malindang-logo.svg') }}" alt="Mount Malindang">
        <h1>Giproseso ang imong pagtimbang...</h1>
        <p class="muted">Palihog hulata samtang susihon ang imong mga timailhan ug kasayuran.</p>
        <div class="loader" aria-label="Nagproseso"></div>
        <div class="steps"><div class="done">✓ Gisusi ang mga pulong nga gisulat</div><div class="done">✓ Gisusi ang mga lagda sa panglawas</div><div class="done">✓ Gidagan ang modelo sa makina</div><div>○ Gihimo ang rekomendasyon sa pagpa-check</div><div>○ Ipakita ang resulta</div></div>
        <p class="muted"><a href="{{ url_for('assessment_detail', assessment_id=result['assessment_id']) }}">Tan-awa dayon ang resulta</a></p>
    </main>
</body>
</html>
